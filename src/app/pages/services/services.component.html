<app-page-hero
  [title]="'services.hero.title' | translate"
  [subtitle]="'services.hero.subtitle' | translate"
  [image]="media.gallery[5]"
></app-page-hero>

<section class="bg-white py-16 lg:py-20">
  <div class="container-x grid gap-10 lg:grid-cols-12">
    <p class="text-2xl leading-snug md:text-3xl lg:col-span-7" appReveal>{{ 'services.intro' | translate }}</p>
    <ul class="flex flex-wrap gap-x-6 gap-y-2 font-semibold lg:col-span-5 lg:justify-end" appReveal>
      <li *ngFor="let s of services">
        <a [routerLink]="[]" [fragment]="s.anchor" class="underline-offset-4 hover:text-brand hover:underline">
          {{ 'services.items.' + s.key + '.title' | translate }}
        </a>
      </li>
    </ul>
  </div>
</section>

<section
  *ngFor="let s of services; let i = index"
  [id]="s.anchor"
  class="py-16 lg:py-24"
  [ngClass]="i % 2 === 0 ? 'bg-mist' : 'bg-white'"
>
  <div class="container-x grid items-center gap-12 lg:grid-cols-2">
    <div [ngClass]="i % 2 === 1 ? 'lg:order-2' : ''" class="aspect-[4/3] overflow-hidden bg-graphite" appReveal="wipe">
      <img [src]="s.image" [alt]="'services.items.' + s.key + '.title' | translate" loading="lazy" class="h-full w-full object-cover" />
    </div>
    <div appReveal>
      <h2 class="h-section">{{ 'services.items.' + s.key + '.title' | translate }}</h2>
      <p class="mt-4 text-xl text-steel">{{ 'services.items.' + s.key + '.summary' | translate }}</p>
      <ul class="mt-8 divide-y divide-line border-y border-line">
        <li *ngFor="let point of 'services.items.' + s.key + '.points' | translate" class="flex gap-4 py-3.5">
          <span class="mt-2.5 h-2 w-2 shrink-0 bg-brand" aria-hidden="true"></span>
          <span>{{ point }}</span>
        </li>
      </ul>
      <a routerLink="/contactos" [queryParams]="{ servico: s.key }" class="btn btn-primary mt-10">
        {{ 'common.requestQuote' | translate }}
      </a>
    </div>
  </div>
</section>
